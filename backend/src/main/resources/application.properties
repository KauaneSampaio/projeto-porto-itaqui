spring.application.name=itaqui-ebitda
server.port=${PORT:8080}

# Front-end: em desenvolvimento lê ../frontend ao vivo; no JAR em produção lê classpath:/static/.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
# Em produção atrás de proxy reverso confiável (Nginx/Cloudflare), defina APP_FORWARD_HEADERS=framework
server.forward-headers-strategy=${APP_FORWARD_HEADERS:none}

# Diretório onde a base alterada e os cenários são gravados (sobrevive a reinícios).
# Se não houver base gravada, carrega a base fictícia de src/main/resources/dados.
app.dados.diretorio=./dados-runtime

# Origens liberadas para o front rodando separado (ex.: Live Server na porta 5500).
# Em produção (mesmo domínio), defina APP_CORS_ORIGENS vazio.
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# Segurança e sessões (em produção com HTTPS, defina APP_COOKIE_SECURE=true e senhas via env)
app.auth.habilitada=${APP_AUTH_HABILITADA:true}
app.auth.senha-admin=${APP_AUTH_SENHA_ADMIN:Itaqui@2026}
app.auth.senha-gestor=${APP_AUTH_SENHA_GESTOR:Gestor@2026}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=ITAQUI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.error.include-stacktrace=never
server.error.include-exception=false

spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.mvc.problemdetails.enabled=false
